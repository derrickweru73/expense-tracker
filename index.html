<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
          <link rel="stylesheet" href="style.css">

 </head>
<body>
    <main class="container">
        <h1>Daily Expense Tracker</h1>
        
        <!-- Total Display -->
        <section class="summary-card">
            <h2>Total Expenses Today: $<span id="total-amount">0.00</span></h2>
        </section>

        <!-- Expense Form -->
        <form id="expense-form">
            <input type="text" id="desc-input" placeholder="Expense Description" required>
            <input type="number" id="amount-input" placeholder="Amount ($)" step="0.01" required>
            <select id="category-input" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
            </select>
            <button type="submit">Add Expense</button>
        </form>

        <!-- Filter Controls -->
        <section class="filters">
            <label for="category-filter">Filter by Category:</label>
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
            </select>
        </section>

        <!-- Expense List Display -->
        <section class="list-container">
            <ul id="expense-list"></ul>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
